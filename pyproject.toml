[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stockpulse"
version = "0.1.0"
description = "A cost-aware TSLA sentiment anomaly monitor using Stocktwits and Apify."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Andy Chen" }
]
dependencies = [
    "apify-client==3.1.1",
    "fastapi==0.139.2",
    "httpx2==2.9.0",
    "python-dotenv==1.2.2",
    "uvicorn==0.51.0",
]

[project.optional-dependencies]
ai = [
    "torch==2.13.0",
    "transformers==5.14.1",
]
postgres = [
    "psycopg[binary]==3.3.4",
    "psycopg-pool==3.3.1",
]

[project.scripts]
stockpulse = "stockpulse.main:main"
stockpulse-api = "stockpulse.api:run"
stockpulse-migrate = "stockpulse.migration:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.package-data]
stockpulse = ["web/*.html", "web/*.css", "web/*.js"]

[tool.setuptools.packages.find]
where = ["src"]
