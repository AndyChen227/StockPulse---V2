[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stockpulse"
version = "0.1.0"
description = "A cost-aware TSLA sentiment anomaly monitor using Stocktwits and Apify."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Andy Chen" }
]
dependencies = [
    "apify-client==3.1.1",
    "python-dotenv==1.2.2",
    "torch==2.13.0",
    "transformers==5.14.1",
]

[project.scripts]
stockpulse = "stockpulse.main:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
