name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install test dependencies
        run: python -m pip install -r config/requirements/postgres.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Compile source and tests
        run: python -m compileall -q src tests

  container-build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build Cloud Run service image
        run: docker build --file containers/service.Dockerfile --tag stockpulse:ci .

      - name: Verify production database runtime
        run: docker run --rm --entrypoint python stockpulse:ci -c "import psycopg, psycopg_pool"

      - name: Start container
        run: docker run --detach --rm --name stockpulse-ci --publish 8080:8080 stockpulse:ci

      - name: Verify health and Dashboard
        run: |
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8080/api/v1/health > /tmp/health.json; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8080/ | grep --quiet StockPulse
          grep --quiet '"status":"ok"' /tmp/health.json

      - name: Show container logs after failure
        if: failure()
        run: docker logs stockpulse-ci

  postgres-dashboard-read:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: stockpulse_test
          POSTGRES_USER: stockpulse
          POSTGRES_PASSWORD: stockpulse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stockpulse -d stockpulse_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      STOCKPULSE_TEST_POSTGRES_URL: postgresql://stockpulse:stockpulse_test@127.0.0.1:5432/stockpulse_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install PostgreSQL dependencies
        run: python -m pip install -r config/requirements/postgres.txt

      - name: Run PostgreSQL Dashboard integration tests
        run: python -m unittest tests.test_postgres_integration -v

  job-container-build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build pinned AI daily job image
        run: docker build --file containers/job.Dockerfile --tag stockpulse-job:ci .

      - name: Verify daily pipeline entry point and cached model
        run: |
          docker run --rm --entrypoint python stockpulse-job:ci -c "import torch, transformers, psycopg"
          docker run --rm --entrypoint python stockpulse-job:ci -c "from transformers import AutoTokenizer; from stockpulse.sentiment import DEFAULT_MODEL_NAME, DEFAULT_MODEL_REVISION; AutoTokenizer.from_pretrained(DEFAULT_MODEL_NAME, revision=DEFAULT_MODEL_REVISION, local_files_only=True)"
